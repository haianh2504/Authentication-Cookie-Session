spring.application.name=Authentication_CookieSession
server.port=8080

spring.datasource.url = ${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
app.admin.seed.email=${ADMIN_EMAIL:}
app.admin.seed.initial-password=${ADMIN_INITIAL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.session.store-type=redis
spring.session.timeout=10m
spring.session.data.redis.namespace=authentication-cookie-session:session

app.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.security.csrf.cookie-name=${CSRF_COOKIE_NAME:XSRF-TOKEN}
app.security.csrf.header-name=${CSRF_HEADER_NAME:X-XSRF-TOKEN}
app.security.csrf.parameter-name=${CSRF_PARAMETER_NAME:_csrf}
app.security.csrf.cookie-path=${CSRF_COOKIE_PATH:/}
app.security.csrf.same-site=${CSRF_COOKIE_SAME_SITE:Lax}
app.security.csrf.cookie-domain=${CSRF_COOKIE_DOMAIN:}
app.security.csrf.cookie-secure=${CSRF_COOKIE_SECURE:false}
app.security.csrf.token-bytes=${CSRF_TOKEN_BYTES:32}

spring.servlet.multipart.max-file-size=15MB
# Cho phép thêm multipart boundary/headers; kích thước file vẫn bị giới hạn 15MB ở dòng trên.
spring.servlet.multipart.max-request-size=16MB

app.supabase.storage.base-url=${SUPABASE_URL:}
app.supabase.storage.api-key=${SUPABASE_SECRET_KEY:}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:gallery}
