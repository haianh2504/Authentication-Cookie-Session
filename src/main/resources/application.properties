spring.application.name=Authentication_CookieSession
server.port=8080

spring.datasource.url = ${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
app.admin.seed.email=${ADMIN_EMAIL:}
app.admin.seed.initial-password=${ADMIN_INITIAL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.session.store-type=redis
spring.session.timeout=10m
spring.session.data.redis.namespace=authentication-cookie-session:session

app.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
